name: Demo Github Actions Workflow

on:
  push:
    branches: 
      - main
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags'

jobs:
  hello: 
    name: Ejecutar Hello Job
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar un mensaje de bienvenida
        run: 
          echo "Bienvenido a Github Actions"
