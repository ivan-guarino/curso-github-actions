name: Create GitHub Issue

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create Issue using GitHub Script
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Error detectado en la aplicación',
              body: `
              ## Descripción

              Se ha identificado un problema que requiere investigación.

              ## Tareas pendientes

              - [ ] Revisar los logs de la aplicación.
              - [ ] Identificar la causa del problema.
              - [ ] Implementar una solución.
              - [ ] Ejecutar pruebas.

              **Creado automáticamente mediante GitHub Actions.**
              `,
              labels: ['bug']
            });

            core.info(`Issue creado correctamente: #${issue.data.number}`);
            core.info(`URL: ${issue.data.html_url}`);
